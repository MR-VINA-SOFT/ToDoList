      --accent-contrast: #241B2E;
      --today: #F98DC9;
      --today-soft: #4A2E45;
      --danger: #E58AA0;
      --border: #4A3956;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 26px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #241B2E;
    --surface: #2F2438;
    --surface-alt: #3A2C46;
    --text: #F3E8F5;
    --text-muted: #B79FC4;
    --accent: #C48FE0;
    --accent-soft: #403150;
    --accent-contrast: #241B2E;
    --today: #F98DC9;
    --today-soft: #4A2E45;
    --danger: #E58AA0;
    --border: #4A3956;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 26px -14px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }

  .app-shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  .app-header {
    margin-bottom: 20px;
    animation: fade-in-up 0.5s ease both;
  }
  .app-header .date-line {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .btn-add {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    padding: 10px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .btn-add:active { transform: scale(0.97); }
  .btn-add svg { width: 14px; height: 14px; }

  .view-toggle {
    display: flex;
    background: var(--surface-alt);
    border-radius: 999px;
    padding: 3px;
  }
  .view-btn {
    border: none;
    background: transparent;
    font-family: inherit;
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
  }
  .view-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

  section { margin-bottom: 26px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px 2px;
  }
  .count-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--text-muted);
    font-size: 10.5px;
    font-weight: 700;
  }

  .today-card {
    background: var(--surface);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow);
    padding: 16px 16px 4px;
    border-left: 4px solid var(--today);
  }
  .today-card .section-title { color: var(--today); }
  .today-card .count-pill { background: var(--today-soft); color: var(--today); }

  .task-list { list-style: none; margin: 0; padding: 0; }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; }

  .check-btn {
    flex: none;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-contrast);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .check-btn svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s ease; }
  .check-btn.done { background: var(--accent); border-color: var(--accent); }
  .check-btn.done svg { opacity: 1; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 13px; font-weight: 500; line-height: 1.4; word-break: break-word; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--text-muted); }
  .task-detail { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; word-break: break-word; }
  .task-meta { font-size: 11px; color: var(--text-muted); margin-top: 5px; display: flex; gap: 8px; align-items: center; }
  .task-meta .time-badge { background: var(--surface-alt); padding: 2px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }

  .delete-btn {
    flex: none;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 50%;
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:hover { color: var(--danger); background: var(--surface-alt); }

  .date-group-title {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    margin: 20px 0 8px 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .date-group-title .is-today { color: var(--today); }
  .date-group-title:first-child { margin-top: 0; }

  .all-list-card {
    background: var(--surface);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow);
    padding: 4px 16px 4px;
  }

  .empty-state { text-align: center; padding: 20px 10px; color: var(--text-muted); font-size: 12px; line-height: 1.6; }

  /* calendar */
  .calendar-card { background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow); padding: 16px; margin-bottom: 22px; }
  .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .calendar-header button {
    background: none; border: none; font-size: 16px; color: var(--accent);
    cursor: pointer; width: 30px; height: 30px; border-radius: 50%;
  }
  .calendar-header button:hover { background: var(--surface-alt); }
  #calendarMonthLabel { font-weight: 700; font-size: 13px; }
  .calendar-weekdays { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; font-size: 10.5px; color: var(--text-muted); margin-bottom: 4px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-cell {
    position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 11.5px; cursor: pointer; color: var(--text);
    background: transparent; border: none; font-family: inherit;
  }
  .cal-cell.empty { cursor: default; visibility: hidden; }
  .cal-cell:hover:not(.empty):not(.selected) { background: var(--surface-alt); }
  .cal-cell.today { font-weight: 700; color: var(--today); }
  .cal-cell.selected { background: var(--accent); color: var(--accent-contrast); font-weight: 700; }
  .cal-cell .dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--today); }
  .cal-cell.selected .dot { background: var(--accent-contrast); }

  .fab-spacer { height: 6px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(60,30,55,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal-sheet {
    width: 100%; max-width: 480px; background: var(--surface);
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow); transform: translateY(24px); transition: transform 0.2s ease;
    max-height: 88vh; overflow-y: auto;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }

  @media (min-width: 560px) {
    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 20px; }
  }

  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-header h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .modal-close { border: none; background: transparent; color: var(--text-muted); font-size: 19px; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; }
  .modal-close:hover { background: var(--surface-alt); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; font-size: 16px; font-family: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 10px 11px;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
  .btn { font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 10px 16px; border-radius: var(--radius-s); border: none; cursor: pointer; }
  .btn-secondary { background: var(--surface-alt); color: var(--text); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn:active { transform: scale(0.97); }

  @keyframes fade-in-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="app-shell">
  <header class="app-header">
    <p class="date-line" id="todayLine"></p>
  </header>

  <div class="toolbar">
    <button class="btn-add" id="openModalBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      새 할일 추가
    </button>
    <div class="view-toggle">
      <button class="view-btn active" id="listViewBtn" data-view="list">리스트형</button>
      <button class="view-btn" id="calendarViewBtn" data-view="calendar">달력형</button>
    </div>
  </div>

  <div id="listView">
    <section>
      <div class="today-card">
        <h2 class="section-title">오늘의 할 일 <span class="count-pill" id="todayCount">0</span></h2>
        <ul class="task-list" id="todayList"></ul>
      </div>
    </section>

    <section>
      <h2 class="section-title">전체 목록 <span class="count-pill" id="allCount">0</span></h2>
      <div class="all-list-card" id="allListCard"></div>
    </section>
  </div>

  <div id="calendarView" style="display:none;">
    <div class="calendar-card">
      <div class="calendar-header">
        <button id="prevMonthBtn" aria-label="이전 달">‹</button>
        <span id="calendarMonthLabel"></span>
        <button id="nextMonthBtn" aria-label="다음 달">›</button>
      </div>
      <div class="calendar-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <section>
      <h2 class="section-title" id="selectedDayTitle">선택한 날의 할 일</h2>
      <div class="all-list-card" id="selectedDayList"></div>
    </section>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>새 할 일</h2>
      <button class="modal-close" id="closeModalBtn" aria-label="닫기">&times;</button>
    </div>
    <form id="taskForm">
      <div class="field">
        <label for="titleInput">제목</label>
        <input type="text" id="titleInput" placeholder="예: 견적서 작성" required maxlength="80">
      </div>
      <div class="field">
        <label for="detailInput">상세 내용</label>
        <textarea id="detailInput" placeholder="자세한 내용을 적어주세요 (선택)"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="dateInput">날짜</label>
          <input type="date" id="dateInput" required>
        </div>
        <div class="field">
          <label for="timeInput">시간</label>
          <input type="time" id="timeInput">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'harussik_tasks_v1';
  var tasks = [];
  var viewMode = 'list';
  var calMonth = new Date();
  calMonth.setDate(1);
  var selectedDate = todayStr();

  function loadTasks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    } catch (e) { tasks = []; }
  }
  function saveTasks() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) { /* unavailable */ }
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function formatHeaderDate() {
    var d = new Date();
    return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  }
  function formatGroupLabel(dateStr) {
    var p = dateStr.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  }
  function formatTime(timeStr) {
    if (!timeStr) return '시간 미정';
    var parts = timeStr.split(':');
    var h = parseInt(parts[0], 10), m = parts[1];
    var period = h < 12 ? '오전' : '오후';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return period + ' ' + h12 + ':' + m;
  }
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function sortTasks(list) {
    return list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var at = a.time || '99:99', bt = b.time || '99:99';
      if (at !== bt) return at < bt ? -1 : 1;
      return 0;
    });
  }
  function checkIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
  }
  function renderTaskItem(task) {
    var li = document.createElement('li');
    li.className = 'task-item' + (task.completed ? ' done' : '');
    var detailHtml = task.detail ? '<div class="task-detail">' + escapeHtml(task.detail) + '</div>' : '';
    li.innerHTML =
      '<button class="check-btn' + (task.completed ? ' done' : '') + '" data-id="' + task.id + '" data-action="toggle" aria-label="완료 표시">' + checkIcon() + '</button>' +
      '<div class="task-body">' +
        '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
        detailHtml +
        '<div class="task-meta"><span class="time-badge">' + formatTime(task.time) + '</span></div>' +
      '</div>' +
      '<button class="delete-btn" data-id="' + task.id + '" data-action="delete" aria-label="삭제">&times;</button>';
    return li;
  }
  function renderTaskListInto(container, list, emptyMsg) {
    container.innerHTML = '';
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state">' + emptyMsg + '</div>';
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'task-list';
    list.forEach(function (t) { ul.appendChild(renderTaskItem(t)); });
    container.appendChild(ul);
  }

  function renderListView() {
    var today = todayStr();
    var sorted = sortTasks(tasks);
    var todayTasks = sorted.filter(function (t) { return t.date === today; });

    var todayListEl = document.getElementById('todayList');
    todayListEl.innerHTML = '';
    if (todayTasks.length === 0) {
      todayListEl.innerHTML = '<li class="empty-state">오늘 예정된 할 일이 없어요.<br>위쪽 버튼으로 추가해보세요.</li>';
    } else {
      todayTasks.forEach(function (t) { todayListEl.appendChild(renderTaskItem(t)); });
    }
    document.getElementById('todayCount').textContent = todayTasks.length;
    document.getElementById('allCount').textContent = tasks.length;

    var allCard = document.getElementById('allListCard');
    allCard.innerHTML = '';
    if (sorted.length === 0) {
      allCard.innerHTML = '<div class="empty-state">등록된 할 일이 없어요.</div>';
      return;
    }
    var currentGroup = null, groupUl = null;
    sorted.forEach(function (t) {
      if (t.date !== currentGroup) {
        currentGroup = t.date;
        var titleEl = document.createElement('div');
        titleEl.className = 'date-group-title';
        var isToday = t.date === today;
        titleEl.innerHTML = (isToday ? '<span class="is-today">오늘 · </span>' : '') + formatGroupLabel(t.date);
        allCard.appendChild(titleEl);
        groupUl = document.createElement('ul');
        groupUl.className = 'task-list';
        allCard.appendChild(groupUl);
      }
      groupUl.appendChild(renderTaskItem(t));
    });
  }

  function renderCalendar() {
    var year = calMonth.getFullYear(), month = calMonth.getMonth();
    document.getElementById('calendarMonthLabel').textContent = year + '년 ' + (month + 1) + '월';

    var firstWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var today = todayStr();

    var taskDates = {};
    tasks.forEach(function (t) { taskDates[t.date] = true; });

    var grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    for (var i = 0; i < firstWeekday; i++) {
      var blank = document.createElement('div');
      blank.className = 'cal-cell empty';
      grid.appendChild(blank);
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = year + '-' + pad(month + 1) + '-' + pad(d);
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell';
      if (dateStr === today) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');
      cell.setAttribute('data-date', dateStr);
      cell.textContent = d;
      if (taskDates[dateStr]) {
        var dot = document.createElement('span');
        dot.className = 'dot';
        cell.appendChild(dot);
      }
      grid.appendChild(cell);
    }
    renderSelectedDayList();
  }

  function renderSelectedDayList() {
    var list = sortTasks(tasks.filter(function (t) { return t.date === selectedDate; }));
    var isToday = selectedDate === todayStr();
    document.getElementById('selectedDayTitle').innerHTML =
      (isToday ? '오늘 · ' : '') + formatGroupLabel(selectedDate) + ' <span class="count-pill">' + list.length + '</span>';
    renderTaskListInto(document.getElementById('selectedDayList'), list, '이 날짜에 등록된 할 일이 없어요.');
  }

  function render() {
    renderListView();
    renderCalendar();
  }

  function switchView(mode) {
    viewMode = mode;
    document.getElementById('listView').style.display = mode === 'list' ? '' : 'none';
    document.getElementById('calendarView').style.display = mode === 'calendar' ? '' : 'none';
    document.getElementById('listViewBtn').classList.toggle('active', mode === 'list');
    document.getElementById('calendarViewBtn').classList.toggle('active', mode === 'calendar');
  }

  function openModal() {
    var prefillDate = viewMode === 'calendar' ? selectedDate : todayStr();
    document.getElementById('dateInput').value = prefillDate;
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(function () { document.getElementById('titleInput').focus(); }, 50);
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('taskForm').reset();
  }
  function handleSubmit(e) {
    e.preventDefault();
    var title = document.getElementById('titleInput').value.trim();
    if (!title) return;
    var task = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: title,
      detail: document.getElementById('detailInput').value.trim(),
      date: document.getElementById('dateInput').value || todayStr(),
      time: document.getElementById('timeInput').value,
      completed: false
    };
    tasks.push(task);
    saveTasks();
    render();
    closeModal();
  }
  function handleListClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var action = btn.getAttribute('data-action');
    if (action === 'toggle') {
      var t = tasks.find(function (x) { return x.id === id; });
      if (t) t.completed = !t.completed;
      saveTasks(); render();
    } else if (action === 'delete') {
      tasks = tasks.filter(function (x) { return x.id !== id; });
      saveTasks(); render();
    }
  }
  function handleCalendarClick(e) {
    var cell = e.target.closest('.cal-cell:not(.empty)');
    if (!cell) return;
    selectedDate = cell.getAttribute('data-date');
    renderCalendar();
  }

  document.getElementById('todayLine').textContent = formatHeaderDate();
  document.getElementById('openModalBtn').addEventListener('click', openModal);
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  document.getElementById('taskForm').addEventListener('submit', handleSubmit);
  document.getElementById('todayList').addEventListener('click', handleListClick);
  document.getElementById('allListCard').addEventListener('click', handleListClick);
  document.getElementById('selectedDayList').addEventListener('click', handleListClick);
  document.getElementById('listViewBtn').addEventListener('click', function () { switchView('list'); });
  document.getElementById('calendarViewBtn').addEventListener('click', function () { switchView('calendar'); });
  document.getElementById('prevMonthBtn').addEventListener('click', function () {
    calMonth.setMonth(calMonth.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', function () {
    calMonth.setMonth(calMonth.getMonth() + 1);
    renderCalendar();
  });
  document.getElementById('calendarGrid').addEventListener('click', handleCalendarClick);

  loadTasks();
  render();
})();
</script>

</body>
</html>
